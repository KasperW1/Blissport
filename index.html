<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blissport · 3D City Map</title>
<style>
:root{--card:rgba(12,10,26,.74);--line:rgba(255,255,255,.09);--txt:#eef1ff;--mut:#9690bd}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05040c;color:var(--txt);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#wrap{position:fixed;inset:0;background:#05040c}
#wrap>canvas{position:absolute;inset:0;display:block;touch-action:none;outline:none;cursor:grab}
.card{position:absolute;background:var(--card);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
#title{top:16px;left:16px;padding:12px 18px;width:260px}
.eyebrow{font-size:10px;letter-spacing:.34em;color:var(--mut);font-weight:700}
#title h1{margin:2px 0;font-size:28px;line-height:1.05;letter-spacing:.2em;font-weight:900;background:linear-gradient(90deg,#ff3da5,#ff8a5c 40%,#ffae3d 60%,#3de0ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px rgba(255,61,165,.45))}
.sub{font-size:12px;color:var(--mut)}
#legend{top:112px;left:16px;width:260px;max-height:calc(100% - 200px);overflow:auto;padding:8px;scrollbar-width:thin}
.gh{display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;padding:10px 8px 6px;cursor:pointer}
.gh i{width:10px;height:10px;border-radius:3px;box-shadow:0 0 10px currentColor}
.gh:hover{filter:brightness(1.3)}
.li{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:10px;cursor:pointer;font-size:13px;transition:background .15s}
.li:hover{background:rgba(255,255,255,.06)}
.li.on{background:rgba(255,255,255,.12)}
.num{flex:none;min-width:22px;height:22px;padding:0 5px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#0a0b16}
.subs{display:flex;gap:4px;margin-left:auto}
.sc{font-size:10px;font-weight:800;padding:2px 5px;border-radius:6px;border:1px solid;cursor:pointer}
.sc.on{background:currentColor}.sc.on span{color:#0a0b16}
#info{top:16px;right:16px;width:330px;max-height:calc(100% - 110px);overflow:auto;padding:16px 18px}
.ih{display:flex;gap:12px;align-items:flex-start}
.badge{flex:none;min-width:40px;height:40px;padding:0 6px;border-radius:12px;display:grid;place-items:center;font-weight:900;color:#0a0b16;font-size:16px}
.grp{font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:800}
#info h2{margin:2px 0 0;font-size:20px;line-height:1.2}
#info h2 small{font-size:12px;color:var(--mut);font-weight:600}
#info h2.big{font-size:26px;letter-spacing:.06em}
#info p{font-size:13.5px;line-height:1.55;color:#d3d0f0;margin:12px 0}
#info h3{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);margin:14px 0 8px}
.x{margin-left:auto;background:none;border:none;color:var(--mut);font-size:16px;cursor:pointer;padding:2px 4px}
.note{font-size:12px;color:var(--mut);margin-top:8px}.note a{color:#b9a8ff;cursor:pointer;text-decoration:underline}
.lml{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.lml li{font-size:13px;padding:7px 10px;border-radius:9px;background:rgba(255,255,255,.05);cursor:pointer;display:flex;align-items:center;gap:8px}
.lml li:hover{background:rgba(255,255,255,.1)}
.lml li::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.lml li.former{color:var(--mut);font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.12);box-shadow:inset 3px 0 0 var(--c);cursor:pointer;background:rgba(255,255,255,.03)}
.chip:hover{background:rgba(255,255,255,.1)}
.glist{display:grid;gap:6px}
.gi{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04);cursor:pointer;font-size:13px}
.gi:hover{background:rgba(255,255,255,.09)}
.gi i{width:10px;height:10px;border-radius:3px;box-shadow:0 0 8px currentColor}.gi span{margin-left:auto;color:var(--mut);font-size:12px}
#toolbar{bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:5px}
#toolbar button{background:none;border:none;color:var(--mut);font-family:inherit;font-size:12.5px;font-weight:650;padding:8px 12px;border-radius:10px;cursor:pointer;white-space:nowrap}
#toolbar button:hover{color:#fff;background:rgba(255,255,255,.06)}
#toolbar button.on{color:#fff;background:rgba(255,61,165,.24)}
#compass{right:16px;bottom:16px;width:58px;height:58px;border-radius:50%;padding:0}
#needle{width:100%;height:100%;display:block}
.card{transition:opacity .3s,transform .4s cubic-bezier(.2,.8,.2,1)}
.tab{position:absolute;z-index:5;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#d8d4f0;font-family:inherit;font-size:12px;font-weight:700;border-radius:10px;padding:7px 10px;cursor:pointer;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.4);transition:left .4s cubic-bezier(.2,.8,.2,1),right .4s cubic-bezier(.2,.8,.2,1),opacity .3s}
.tab:hover{color:#fff;background:rgba(40,30,70,.88)}
#tabL{left:282px;top:112px}
#tabR{right:352px;top:16px}
#wrap.noL #legend{transform:translateX(-300px);opacity:0;pointer-events:none}
#wrap.noL #tabL{left:8px}
#wrap.noR #info{transform:translateX(370px);opacity:0;pointer-events:none}
#wrap.noR #tabR{right:8px}
#tabR.ping{animation:ping 1s ease 3}
@keyframes ping{50%{box-shadow:0 0 0 4px rgba(255,61,165,.45),0 0 22px rgba(255,61,165,.6);color:#fff}}
#showUI{display:none;left:16px;bottom:16px}
#wrap.clean>.card,#wrap.clean>.tab,#wrap.clean>#hint{opacity:0;pointer-events:none}
#wrap.clean #showUI{display:block;opacity:1;pointer-events:auto}
@media (max-width:760px){#tabL{display:none}#tabR{right:16px;top:72px}#wrap.noR #info{transform:translateY(120%)}#wrap.noR #tabR{right:16px}}
#nav{right:16px;bottom:86px;width:60px;padding:6px 5px;display:flex;flex-direction:column;align-items:center;gap:3px}
#nav button{width:48px;height:26px;border:none;border-radius:8px;background:rgba(255,255,255,.05);color:#d8d4f0;font-size:14px;cursor:pointer;display:grid;place-items:center;padding:0;font-family:inherit;user-select:none;-webkit-user-select:none;touch-action:none}
#nav button:hover{background:rgba(255,255,255,.12);color:#fff}
#nav button.hold{background:rgba(255,61,165,.38);color:#fff}
#nav .row{display:flex;gap:3px}#nav .row button{width:23px}
#nav .dpad{display:grid;grid-template-columns:repeat(3,16px);grid-template-rows:repeat(3,16px);gap:1px}
#nav .dpad button{width:16px;height:16px;font-size:8px;border-radius:4px}
#nav .sep{width:70%;height:1px;background:rgba(255,255,255,.1);margin:2px 0}
#nav .tp{font-size:7.5px;font-weight:800;letter-spacing:.06em;height:22px}
#nav .tp.on{background:rgba(255,61,165,.32);color:#fff;box-shadow:0 0 12px rgba(255,61,165,.35)}
#info{max-height:calc(100% - 330px)}
@media (max-width:760px){#nav{display:none}#info{max-height:38%}}
#hint{position:absolute;left:50%;bottom:68px;transform:translateX(-50%);width:max-content;max-width:min(760px,calc(100% - 200px));text-align:center;font-size:11px;line-height:1.4;color:var(--mut);pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.8);transition:opacity .3s}
#tip{position:fixed;left:0;top:0;pointer-events:none;opacity:0;transition:opacity .12s;background:rgba(6,5,16,.92);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:7px 10px;font-size:12.5px;z-index:9}
#tip span{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;white-space:nowrap;user-select:none;will-change:transform;transition:opacity .25s}
.lab.d{display:flex;align-items:center;gap:7px;padding:3px 10px 3px 3px;border-radius:999px;background:rgba(8,6,20,.84);border:1px solid rgba(255,255,255,.14);font-size:12.5px;font-weight:650;color:#fff;box-shadow:0 4px 18px rgba(0,0,0,.6)}
.lab.d .n{min-width:20px;height:20px;padding:0 4px;border-radius:999px;display:grid;place-items:center;font-size:10.5px;font-weight:850;color:#090a14}
.lab.s{font-size:10.5px;font-weight:650;color:#fff;padding:2px 7px;border-radius:6px;background:rgba(8,6,20,.82);border:1px solid rgba(255,255,255,.12);display:flex;gap:5px;align-items:center}
.lab i{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none;box-shadow:0 0 6px currentColor}
.lab.lm{font-size:10.5px;font-weight:550;color:#efeaff;padding:3px 8px;border-radius:7px;background:rgba(6,5,16,.86);border:1px solid rgba(255,255,255,.1);display:flex;gap:6px;align-items:center}
.lab.lm em{color:var(--mut);font-weight:500}
.lab.q{font-size:9.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#ffcf85;text-shadow:0 1px 4px #000,0 0 10px rgba(0,0,0,.9)}
.lab.dim{opacity:.3}
.lab.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.25),0 6px 24px rgba(0,0,0,.6)}
.lab.pulse{animation:pulse 1.2s ease 2}
@keyframes pulse{50%{filter:brightness(2) drop-shadow(0 0 8px #fff)}}
#legendBtn{display:none;top:100px;left:16px;padding:8px 12px;color:#fff;font-family:inherit;font-weight:700;font-size:12.5px;cursor:pointer}
#loading{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;background:#05040c;z-index:20;color:var(--mut);font-size:13px;letter-spacing:.12em}
.spin{width:38px;height:38px;border-radius:50%;border:3px solid rgba(255,255,255,.1);border-top-color:#ff3da5;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:760px){
 #title{width:auto;padding:9px 14px}#title h1{font-size:20px}.sub{display:none}
 #legendBtn{display:block;top:80px}
 #legend{display:none;top:124px;max-height:calc(100% - 330px)}#legend.open{display:block}
 #info{top:auto;bottom:74px;left:10px;right:10px;width:auto;max-height:38%}
 #hint{display:none}#compass{top:16px;bottom:auto;width:48px;height:48px}
 #toolbar{bottom:12px}#toolbar button{padding:8px 8px;font-size:11.5px}
}
</style>
</head>
<body>
<div id="wrap">
 <div id="labels"></div>
 <div id="title" class="card"><div class="eyebrow">CITY ATLAS · AFTER DARK</div><h1>BLISSPORT</h1><div class="sub">Interactive 3D night map</div></div>
 <button id="legendBtn" class="card">☰ Districts</button>
 <aside id="legend" class="card"></aside>
 <button id="tabL" class="tab" title="Hide districts panel">‹</button>
 <section id="info" class="card"></section>
 <button id="tabR" class="tab" title="Hide info panel">›</button>
 <button id="showUI" class="tab" title="Show menus (H)">◰ Show menus</button>
 <div id="toolbar" class="card">
  <button data-act="reset">⟲ Reset</button>
  <button data-act="rotate">↻ Orbit</button>
  <button data-act="day" id="dayBtn">☀ Day</button>
  <button data-act="snow" id="snowBtn">❄ Snow</button>
  <button data-act="glow" class="on">✦ Glow</button>
  <button data-act="beams" class="on">⇡ Beams</button>
  <button data-act="labels" class="on">Labels</button>
  <button data-act="lm" class="on">Landmarks</button>
  <button data-act="ui" title="Hide all menus (H)">◱ Hide UI</button>
 </div>
 <div id="compass" class="card"><svg id="needle" viewBox="0 0 60 60"><circle cx="30" cy="30" r="21" fill="none" stroke="rgba(255,255,255,.12)"/><path d="M30 11 L35 30 L30 27 L25 30Z" fill="#ff3da5"/><path d="M30 49 L35 30 L30 33 L25 30Z" fill="#3b3470"/><text x="30" y="8.5" text-anchor="middle" font-size="7.5" font-weight="800" fill="#fff" font-family="sans-serif">N</text></svg></div>
 <div id="nav" class="card">
  <button data-n="zin" title="Zoom in  (+)">＋</button>
  <button data-n="zout" title="Zoom out  (−)">－</button>
  <div class="sep"></div>
  <div class="dpad">
   <button data-n="up" style="grid-area:1/2" title="Pan up  (W / ↑)">▲</button>
   <button data-n="left" style="grid-area:2/1" title="Pan left  (A / ←)">◀</button>
   <button data-n="right" style="grid-area:2/3" title="Pan right  (D / →)">▶</button>
   <button data-n="down" style="grid-area:3/2" title="Pan down  (S / ↓)">▼</button>
  </div>
  <div class="sep"></div>
  <div class="row"><button data-n="rl" title="Rotate left  (Q)">⟲</button><button data-n="rr" title="Rotate right  (E)">⟳</button></div>
  <div class="row"><button data-n="tu" title="Tilt toward top-down  (R)">⤒</button><button data-n="td" title="Tilt toward horizon  (F)">⤓</button></div>
  <div class="sep"></div>
  <button data-n="tp" class="tp" title="Trackpad mode: two-finger scroll pans, pinch zooms, ⌥/Alt + scroll rotates & tilts">TRACKPAD</button>
 </div>
 <div id="hint">Drag to orbit · Right/Shift-drag to pan · Scroll or pinch to zoom · Keys: WASD/arrows pan, Q/E rotate, R/F tilt, +/− zoom</div>
 <div id="tip"></div>
 <div id="loading"><div class="spin"></div><div>LIGHTING UP BLISSPORT…</div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
const MW=120,MH=90,S=12,PW=MW*S,PH=MH*S,DS=6,DW=MW*DS,DH=MH*DS;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function hash(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296;}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y){return vnoise(x,y)*.62+vnoise(x*2.13+5.2,y*2.13+1.3)*.38;}
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rand=mulberry(20261003),R=(a,b)=>a+(b-a)*rand();
const hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const n01=c=>[c[0]/255,c[1]/255,c[2]/255];
const pick=a=>a[(rand()*a.length)|0];
// shipping-container colours (used on the docks and on cargo ships)
var CPAL2=['#c0392b','#2e86de','#e67e22','#27ae60','#8e44ad','#d4ac0d','#7f8c8d','#16a085','#e8e8e8'].map(h=>n01(hx(h)).map(v=>v*.8));
// shared ship hull (pointed bow, square stern), used by cargo ships and tugboats
var CHG=null,CHM={};
function cargoHull(){if(!CHG){const s=new THREE.Shape();s.moveTo(-.5,-.44);s.lineTo(.3,-.5);s.quadraticCurveTo(.47,-.4,.5,0);s.quadraticCurveTo(.47,.4,.3,.5);s.lineTo(-.5,.44);s.closePath();
 CHG=new THREE.ExtrudeGeometry(s,{depth:1,bevelEnabled:false,curveSegments:10});CHG.rotateX(-Math.PI/2);CHG.computeVertexNormals();}return CHG;}
function hullMesh(x,y,r,L,W,h,y0,col){const m=new THREE.Mesh(cargoHull(),CHM[col]||(CHM[col]=new THREE.MeshLambertMaterial({color:col})));
 m.scale.set(L,h,W);m.rotation.y=r;m.position.set(x-MW/2,y0,y-MH/2);m.castShadow=true;m.receiveShadow=true;scene.add(m);}
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay;let t=((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy);t=t<0?0:t>1?1:t;const ex=ax+t*dx-px,ey=ay+t*dy-py;return Math.sqrt(ex*ex+ey*ey);}
function polyDist(px,py,P){let m=1e9;for(let i=0;i<P.length-1;i++){const d=segDist(px,py,P[i][0],P[i][1],P[i+1][0],P[i+1][1]);if(d<m)m=d;}return m;}
function qb(P,t){const a=P[0],b=P[1],c=P[2],u=1-t;return[u*u*a[0]+2*u*t*b[0]+t*t*c[0],u*u*a[1]+2*u*t*b[1]+t*t*c[1]];}
function qbt(P,t){const a=P[0],b=P[1],c=P[2];return[2*(1-t)*(b[0]-a[0])+2*t*(c[0]-b[0]),2*(1-t)*(b[1]-a[1])+2*t*(c[1]-b[1])];}

// ---------------- DATA ----------------
const GROUPS={
 RLD:{name:'The Red-Light District',col:'#ff3da5',desc:"The beating heart of Blissport — its economic and entertainment center, and the literal physical center of the city too. Five neighborhoods, each with a distinct personality, pull in millions of tourists every year. Without it, Blissport would be nothing."},
 RES:{name:'The Residential Zones',col:'#6f95ff',desc:"The second-largest district by volume and the most widely spread — its neighborhoods intercut or completely envelop other districts. They range from middle-class suburbs and tightly packed apartment blocks to massive estates out where farmland would usually be."},
 DOCK:{name:'Dockside',col:'#ffae3d',desc:"Naturally, a city named Blissport has a very busy harbour. Dockside is the second most important economic district of the city after the RLD."},
 DOWN:{name:'Downtown',col:'#3de0ff',desc:"If the RLD is the beating heart, Downtown is the brains — government blocks and headquarters for larger corporations. Relatively unimpressive for a city this size, and the least important economic hub behind the RLD and Dockside."},
 DEAD:{name:'Dead-End',col:'#d08a5c',desc:"A much shadier, abandoned edge of the city. Streets bordering other neighborhoods are blocked off by the forever-unfinished construction of long-cancelled development projects. Police rarely bother coming here — anything and anyone is up for grabs."}
};
const D=[
{key:'coffer',num:'1',name:'The Coffer',g:'RLD',col:'#ff2e93',seeds:[[52,65.5]],w:15,st:[2.4,.1,.32],h:[2.4,6.2],p:.95,k:2,f:.86,neon:.7,peak:[52,65.5,1.7,40],lh:16,sty:'neon',win:[.75,2,.32],desc:"The busiest, most central and most profitable area of the RLD. The Three Velvets stand at its very center, and the Candyshop is found here too."},
{key:'bottom',num:'2',name:'Bottom Heap',g:'RLD',col:'#ff5468',seeds:[[51,81]],w:-25,st:[2.2,-.22,.3],h:[1.6,4.2],p:.9,k:2,f:.86,neon:.6,lh:8,sty:'neon',win:[.7,2,.3],desc:"The second-busiest area of the RLD, in direct competition with the Coffer, and known for its sex stores. The Old Playground and Petite Pleasures sit side by side on the same street (the glowing one), with the Cake'd Up Wish and the Vault nearby."},
{key:'greenway',num:'3',name:'Greenway',g:'RLD',col:'#39e07a',seeds:[[55,53.5]],w:0,st:[2.8,.35,.38],h:[.8,2.2],p:.5,k:2,f:.8,neon:.15,lh:6,sty:'green',win:[.55,0,.3],desc:"An almost entirely pedestrian neighborhood known for its green streetlights at night and greenery so abundant it blocks out the sky on some streets. The Menagerie is found here."},
{key:'piers',num:'4',name:'The Piers',g:'RLD',col:'#ff8ad8',seeds:[],st:[2.2,Math.PI/4,.3],h:[2,7],p:.8,k:1,f:.82,neon:.65,lh:10,sty:'neon',win:[.72,0,.3],desc:"A waterside stretch of the RLD running along most of the coast until it meets South-of-Wharf, filled with restaurants and hotels. Sinful Sunday is located here."},

   .replace('#include <project_vertex>','#include <project_vertex>\nvWD=-mvPosition.z;');

  if(d.sub)mkLabel('sub','s',`<i style="background:${d.col};color:${d.col}"></i>${d.name}`,W3(x,y,d.lh),[i],()=>selDistrict(i));
  else mkLabel('d','d',`<span class="n" style="background:${d.col};box-shadow:0 0 10px ${d.col}">${d.num}</span><span>${d.name}</span>`,W3(x,y,d.lh),[i],()=>selDistrict(i));});
 const c=centroidOf(ENC);mkLabel('enc','d',`<span class="n" style="background:#6f95ff">8</span><span>Latin Enclaves</span>`,W3(c.x,c.y-2.4,9),ENC,selEnc);
 FINGERS.forEach(F=>{const [x,y]=qb(F.p,1),[tx,ty]=qbt(F.p,1),L=Math.hypot(tx,ty);mkLabel('q','q',F.name,W3(x+tx/L*1.9,y+ty/L*1.9,.6),[FNG],()=>selDistrict(FNG));});
 LM.forEach(l=>{const d=D[ID[l.d]],cc=l.former?'#9aa0b8':d.col;mkLabel('lm','lm',`<i style="background:${cc};color:${cc}"></i>${l.name}${l.former?' <em>(former)</em>':''}${l.note?` <em>(${l.note})</em>`:''}`,l.pos,[ID[l.d]],()=>focusLM(l.id),{lm:l.id});});}
const pv=new THREE.Vector3();
function updLabels(){for(const L of LABELS){let vis;
  if(L.kind==='d'||L.kind==='enc')vis=showLabels;else if(L.kind==='sub')vis=showLabels&&(radius<125||SEL.has(L.ids[0]));
  else if(L.kind==='q')vis=showLabels&&(radius<95||SEL.has(FNG));else vis=showLM&&(radius<85||SEL.has(L.ids[0]));
  if(vis){pv.copy(L.pos).project(camera);if(pv.z>1||Math.abs(pv.x)>1.15||Math.abs(pv.y)>1.15)vis=false;}
  if(!vis){if(L.shown){L.el.style.display='none';L.shown=false;}continue;}
  if(!L.shown){L.el.style.display='';L.shown=true;}
  L.el.style.transform=`translate(${(pv.x*.5+.5)*VW}px,${(-pv.y*.5+.5)*VH}px) translate(-50%,-50%)`;}}

// ---------------- CONTROLS ----------------
const ptrs=new Map(),ray=new THREE.Raycaster(),ndc=new THREE.Vector2();let mode=null,moved=0,pinch0=0,mid0=null,hover=null,hoverDirty=false;
function updCam(){const sp=Math.sin(phi);camera.position.set(target.x+radius*sp*Math.sin(theta),radius*Math.cos(phi),target.z+radius*sp*Math.cos(theta));camera.lookAt(target);}
function pan(dx,dy){const k=radius*.0016,ct=Math.cos(theta),st=Math.sin(theta);target.x=clamp(target.x+(-dx*ct-dy*st)*k,-95,70);target.z=clamp(target.z+(dx*st-dy*ct)*k,-72,55);}
function pickAt(cx,cy){const r=el.getBoundingClientRect();ndc.set((cx-r.left)/r.width*2-1,-(cy-r.top)/r.height*2+1);ray.setFromCamera(ndc,camera);
 const h=ray.intersectObjects([bodyM,slab],false)[0];if(!h)return null;const mx=h.point.x+MW/2,my=h.point.z+MH/2;if(mx<0||my<0||mx>=MW||my>=MH)return null;
 if(h.object===slab&&!landAt(mx,my))return null;const d=distAt(mx,my);return d>=0?d:null;}
el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});fly=null;tip.style.opacity=0;
 if(ptrs.size===1){moved=0;mode=(e.button===2||e.shiftKey||e.ctrlKey||e.metaKey)?'pan':'rot';el.style.cursor='grabbing';}
 else if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);mid0={x:(a.x+b.x)/2,y:(a.y+b.y)/2};mode='pinch';}});
el.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);
 if(!p){if(e.pointerType==='mouse'){hover={x:e.clientX,y:e.clientY};hoverDirty=true;}return;}
 const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
 if(mode==='rot'){theta-=dx*.0055;phi=clamp(phi-dy*.0055,.12,1.38);}else if(mode==='pan')pan(dx,dy);
 else if(mode==='pinch'&&ptrs.size===2){const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};if(pinch0>0&&d>0)radius=clamp(radius*pinch0/d,18,240);pinch0=d;pan(m.x-mid0.x,m.y-mid0.y);mid0=m;moved+=10;}});
function up(e){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
 if(!ptrs.size){if(mode!=='pinch'&&moved<6&&e.type==='pointerup'){const d=pickAt(e.clientX,e.clientY);if(d===null){select([]);infoDefault();}else selDistrict(d);}mode=null;el.style.cursor='grab';}
 else{mode='rot';moved=99;}}
el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
el.addEventListener('pointerleave',()=>{tip.style.opacity=0;hover=null;});
el.addEventListener('contextmenu',e=>e.preventDefault());
// ---- navigation for trackpads, keyboards and on-screen buttons
const NAV={keys:new Set(),hold:null,tp:false,hinted:false};
const HINT_DEF=$('hint').textContent,HINT_TP='Trackpad mode: two-finger scroll to pan · pinch to zoom · ⌥/Alt + scroll to rotate & tilt · click-drag to orbit';
el.addEventListener('wheel',e=>{e.preventDefault();fly=null;
 if(e.ctrlKey){radius=clamp(radius*Math.exp(e.deltaY*.012),18,240);return;}            // trackpad pinch (Chrome, Edge, Firefox)
 if(NAV.tp){if(e.altKey){theta-=e.deltaX*.004;phi=clamp(phi-e.deltaY*.004,.12,1.38);}else pan(-e.deltaX*.9,-e.deltaY*.9);return;}
 if(!NAV.hinted&&Math.abs(e.deltaX)>2){NAV.hinted=true;$('hint').textContent='Using a trackpad? Turn on TRACKPAD mode in the panel at the bottom right for two-finger panning.';}
 const dy=e.deltaMode===1?e.deltaY*33:e.deltaY;radius=clamp(radius*Math.exp(dy*.0011),18,240);},{passive:false});
// Safari trackpad pinch / rotate gestures
let gS=1,gR=0;
el.addEventListener('gesturestart',e=>{e.preventDefault();gS=1;gR=0;fly=null;});
el.addEventListener('gesturechange',e=>{e.preventDefault();radius=clamp(radius*gS/e.scale,18,240);gS=e.scale;theta-=(e.rotation-gR)*Math.PI/180;gR=e.rotation;});
el.addEventListener('gestureend',e=>e.preventDefault());
// continuous actions (keyboard + held buttons)
const ACT={up:()=>pan(0,4),down:()=>pan(0,-4),left:()=>pan(4,0),right:()=>pan(-4,0),zin:()=>radius=clamp(radius*.978,18,240),zout:()=>radius=clamp(radius/.978,18,240),
 rl:()=>theta+=.022,rr:()=>theta-=.022,tu:()=>phi=clamp(phi-.014,.12,1.38),td:()=>phi=clamp(phi+.014,.12,1.38)};
const KM={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right','+':'zin','=':'zin','-':'zout','_':'zout',q:'rl',e:'rr',r:'tu',f:'td'};
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key.toLowerCase();if(!KM[k])return;NAV.keys.add(k);fly=null;if(k.startsWith('arrow'))e.preventDefault();});
addEventListener('keyup',e=>NAV.keys.delete(e.key.toLowerCase()));
addEventListener('blur',()=>NAV.keys.clear());
FRAMEHOOKS.push(()=>{NAV.keys.forEach(k=>ACT[KM[k]]());if(NAV.hold)ACT[NAV.hold]();});
const navEl=$('nav');
navEl.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-n]');if(!b)return;e.preventDefault();const n=b.dataset.n;
 if(n==='tp'){NAV.tp=!NAV.tp;b.classList.toggle('on',NAV.tp);$('hint').textContent=NAV.tp?HINT_TP:HINT_DEF;return;}
 fly=null;for(let i=0;i<6;i++)ACT[n]();NAV.hold=n;b.classList.add('hold');b.setPointerCapture(e.pointerId);});
const navRel=()=>{NAV.hold=null;navEl.querySelectorAll('.hold').forEach(b=>b.classList.remove('hold'));};
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>navEl.addEventListener(ev,navRel));
// ---- collapsible side panels & clean view
const tabL=$('tabL'),tabR=$('tabR');
function setPanel(side,open){wrap.classList.toggle(side==='L'?'noL':'noR',!open);
 if(side==='L'){tabL.textContent=open?'‹':'☰ Districts ›';tabL.title=open?'Hide districts panel':'Show districts panel';}
 else{tabR.textContent=open?'›':'‹ ⓘ Info';tabR.title=open?'Hide info panel':'Show info panel';tabR.classList.remove('ping');}}
tabL.onclick=()=>setPanel('L',wrap.classList.contains('noL'));
tabR.onclick=()=>setPanel('R',wrap.classList.contains('noR'));
new MutationObserver(()=>{if(wrap.classList.contains('noR')){tabR.classList.remove('ping');void tabR.offsetWidth;tabR.classList.add('ping');}}).observe(info,{childList:true});
function setClean(on){wrap.classList.toggle('clean',on);if(on)tip.style.opacity=0;}
$('showUI').onclick=()=>setClean(false);
$('toolbar').addEventListener('click',e=>{const b=e.target.closest('button');if(b&&b.dataset.act==='ui')setClean(true);});
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key.toLowerCase();
 if(k==='h')setClean(!wrap.classList.contains('clean'));else if(k==='escape'&&wrap.classList.contains('clean'))setClean(false);});
addEventListener('keydown',e=>{if(e.key==='Escape'){select([]);infoDefault();}});
function doHover(){const d=pickAt(hover.x,hover.y);if(d===null){tip.style.opacity=0;el.style.cursor='grab';return;}const g=GROUPS[D[d].g];
 tip.innerHTML=`<b>${D[d].sub?D[d].short:D[d].num} · ${D[d].name}</b><span style="color:${g.col}">${g.name}</span>`;tip.style.transform=`translate(${hover.x+16}px,${hover.y+16}px)`;tip.style.opacity=1;el.style.cursor='pointer';}
const homeR=()=>VW/VH<1?185:118;
$('toolbar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.act;
 if(a==='reset')flyTo(58,52,homeR(),Math.round(theta/(2*Math.PI))*2*Math.PI,.92);
 else if(a==='rotate'){autoRot=!autoRot;b.classList.toggle('on',autoRot);}
 else if(a==='glow'){post.on=!post.on;b.classList.toggle('on',post.on);}
 else if(a==='beams'){post.beams=post.beams===false;b.classList.toggle('on',post.beams);SPOTS.forEach(s=>{if(!s.lh)s.p.visible=post.beams&&DN.day<.5;});}
 else if(a==='labels'){showLabels=!showLabels;b.classList.toggle('on',showLabels);}
 else if(a==='lm'){showLM=!showLM;b.classList.toggle('on',showLM);}});
function resize(){VW=wrap.clientWidth;VH=wrap.clientHeight;renderer.setSize(VW,VH);camera.aspect=VW/VH;camera.updateProjectionMatrix();sizePost();}
addEventListener('resize',resize);

const clock=new THREE.Clock();let frame=0;
function loop(){requestAnimationFrame(loop);frame++;const t=clock.getElapsedTime();
 if(autoRot&&!ptrs.size)theta+=.0016;
 if(fly){target.lerp(fly.t,.075);radius+=(fly.r-radius)*.075;if(fly.th!=null){theta+=(fly.th-theta)*.075;phi+=(fly.ph-phi)*.075;}
  if(target.distanceTo(fly.t)<.03&&Math.abs(radius-fly.r)<.05)fly=null;}
 SPOTS.forEach(s=>s.p.rotation.y=t*s.s+s.o);
 if(beacMat)beacMat.opacity=.15+.85*Math.pow(.5+.5*Math.sin(t*2.6),8);
 updCam();if(hover&&hoverDirty&&frame%3===0&&!ptrs.size){hoverDirty=false;doHover();}
 render();updLabels();needle.style.transform=`rotate(${theta}rad)`;}

// ---------------- QUALITY SETTINGS (Auto / Low / Medium / High) ----------------
// Auto picks a level from the device and steps down if the frame rate stays under ~30 fps. ?quality=low|medium|high|auto in the URL forces a mode.
const QL={low:{pr:1,bloom:false,refl:false,shadow:0,flakes:5000,mist:false},
 medium:{pr:1.25,bloom:true,refl:true,shadow:1024,flakes:12000,mist:true},
 high:{pr:1.75,bloom:true,refl:true,shadow:2048,flakes:26000,mist:true}};
const LV=['low','medium','high'];
const Q=(()=>{const touch=('ontouchstart' in window)||navigator.maxTouchPoints>0,small=Math.min(screen.width,screen.height)<=820,mem=navigator.deviceMemory||8;
 const dev=touch&&small?'low':touch?'medium':mem<=4?'medium':'high',p=(new URLSearchParams(location.search).get('quality')||'').toLowerCase();
 return{mode:LV.includes(p)?p:'auto',dev,cur:null,q:QL[dev],drops:0,acc:0,n:0,t0:performance.now(),last:performance.now(),warm:0};})();
// toolbar button + small-screen toolbar styling
const qBtn=document.createElement('button');qBtn.dataset.act='quality';qBtn.title='Graphics quality (click to change)';$('toolbar').appendChild(qBtn);
{const st=document.createElement('style');st.textContent='@media (max-width:760px){#toolbar{left:10px;right:10px;transform:none;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}#toolbar::-webkit-scrollbar{display:none}#toolbar button{flex:none}}';document.head.appendChild(st);}
// water reflections can be switched off: the sea then shows its own colour without the mirror pass
const _renderRefl=renderRefl,BLACK=new THREE.DataTexture(new Uint8Array([0,0,0,255]),1,1,THREE.RGBAFormat);BLACK.needsUpdate=true;
renderRefl=function(t){if(!water)return;const u=water.material.uniforms;if(Q.q.refl){if(REFL.rt)u.tR.value=REFL.rt.texture;_renderRefl(t);}else{u.t.value=t;u.tR.value=BLACK;}};
function applyQuality(level){const q=QL[level];Q.cur=level;Q.q=q;
 renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,q.pr));resize();
 post.on=q.bloom;document.querySelector('#toolbar [data-act="glow"]').classList.toggle('on',post.on);
 const sh=q.shadow>0;
 if(sh!==renderer.shadowMap.enabled){renderer.shadowMap.enabled=sh;scene.traverse(o=>{const m=o.material;if(m)(Array.isArray(m)?m:[m]).forEach(x=>x.needsUpdate=true);});DN.applied=false;}
 if(sh&&moon.shadow.mapSize.x!==q.shadow){moon.shadow.mapSize.set(q.shadow,q.shadow);if(moon.shadow.map){moon.shadow.map.dispose();moon.shadow.map=null;}}
 renderer.shadowMap.needsUpdate=true;
 qBtn.textContent='⚙ '+(Q.mode==='auto'?'Auto · '+level[0].toUpperCase()+level.slice(1):level[0].toUpperCase()+level.slice(1));}
qBtn.addEventListener('click',()=>{const order=['auto','low','medium','high'];Q.mode=order[(order.indexOf(Q.mode)+1)%4];Q.drops=0;Q.warm=0;applyQuality(Q.mode==='auto'?Q.dev:Q.mode);});
// per-frame: snowflake count, Greenway mist, and the Auto frame-rate watchdog
FRAMEHOOKS.push(()=>{
 if(SNW.pts)SNW.pts.geometry.setDrawRange(0,Q.q.flakes);
 if(Q.mist===undefined){const g=scene.children.find(o=>o.isGroup&&o.children.some(c=>c.isPoints&&c.material.size===.32));Q.mist=g?g.children.filter(c=>c.isMesh):[];}
 for(const m of Q.mist)m.visible=Q.q.mist;
 const now=performance.now(),dt=now-Q.last;Q.last=now;if(Q.mode!=='auto'||document.hidden||dt>250)return;
 if(++Q.warm<120)return;Q.acc+=dt;Q.n++;
 if(Q.acc>4000){const fps=1000*Q.n/Q.acc;Q.acc=0;Q.n=0;const i=LV.indexOf(Q.cur);if(fps<30&&i>0&&Q.drops<2){Q.drops++;Q.warm=0;applyQuality(LV[i-1]);}}});
applyQuality(Q.mode==='auto'?Q.dev:Q.mode);

resize();
setTimeout(()=>{buildMaps();assemble();buildLegend();buildLabels();infoDefault();drawOverlay();
 radius=homeR();updCam();$('loading').remove();loop();},40);
})();
